<!DOCTYPE HTML>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>MIME TYPES EXAMPLE</title>
<link rel='stylesheet' href='style.css'>
<script src='script.js' defer></script>
</head>
<body>
<h3>JavaScript</h3>
<p>Click a colour to apply CSS.</p>
<hr>
<div class='stickman'>
<div id='head'></div>
<div id='body'></div>
<div id='arms'></div>
<div id='left-leg'></div>
<div id='right-leg'></div>
</div>
<p>Change Stickman Colour:</p>
<a href='#' onclick="changeColor('red'); return false;">Red</a> |
<a href='#' onclick="changeColor('blue'); return false;">Blue</a> |
<a href='#' onclick="changeColor('green'); return false;">Green</a>
<hr>
<h3>Image</h3>
<table border='1' cellpadding='15' cellspacing='0' width='100%'>
<tr>
<th>mime type</th>
<th>image</th>
</tr>
<tr>
<td>image/jpeg</td>
<td><img src='earlorithm.jpg' width='150'></td>
</tr>
<tr>
<td>image/png</td>
<td><img src='earlorithm.png' width='150'></td>
</tr>
<tr>
<td>image/x-icon</td>
<td><img src='favicon.ico' width='32' height='32'></td>
</tr>
</table>
</body>
</html>
